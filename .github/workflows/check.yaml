on:
  push:
    branches:
      - main
  pull_request: {}

name: Test

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: calcit-lang/setup-calcit@v1
        with:
          tools: calcit,caps

      - name: Validate Calcit snapshot and types
        run: |
          caps --ci
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only
          calcit calcit.cirru analyze quality --baseline config/calcit-quality.json --format json

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check

      - run: cargo test

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo build --release

      - name: Verify C-safe exports only
        run: |
          exports="$(nm -D --defined-only target/release/libcalcit_http.so)"
          grep -q ' calcit_ffi_async_version$' <<<"$exports"
          grep -q ' calcit_ffi_buffer_version$' <<<"$exports"
          grep -q ' serve_http_calcit_ffi_async_v1$' <<<"$exports"
          grep -q ' smoke_ping_calcit_ffi_v1$' <<<"$exports"
          ! grep -Eq ' (abi_version|edn_version|serve_http|smoke_ping)$' <<<"$exports"

      - run: rm -rfv dylibs/* && mkdir -p dylibs/ && cp -v target/release/libcalcit_http.so dylibs/

      - run: calcit calcit.cirru

      - name: Verify async server response and cancellation
        run: bash scripts/check-server-ffi.sh
