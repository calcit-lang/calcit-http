on:
  push:
    branches:
      - main
  pull_request: {}

name: Test

permissions:
  contents: read

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1
        with:
          tools: calcit,caps

      - name: Validate Calcit snapshot and types
        run: |
          caps --strict --ci
          caps verify --toolchain
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only
          calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru --format json
          calcit calcit.cirru analyze dynamic-methods --max 0
          calcit calcit.cirru docs format-md README.md --check
          calcit calcit.cirru docs check-md README.md --failures-only

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - run: cargo fmt --check

      - run: cargo test

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo build --release

      - name: Verify C-safe exports only
        run: |
          exports="$(nm -D --defined-only target/release/libcalcit_http.so)"
          grep -q ' calcit_ffi_async_version$' <<<"$exports"
          grep -q ' calcit_ffi_buffer_version$' <<<"$exports"
          grep -q ' serve_http_calcit_ffi_async_v1$' <<<"$exports"
          grep -q ' smoke_ping_calcit_ffi_v1$' <<<"$exports"
          ! grep -Eq ' (abi_version|edn_version|serve_http|smoke_ping)$' <<<"$exports"

      - run: rm -rfv dylibs/* && mkdir -p dylibs/ && cp -v target/release/libcalcit_http.so dylibs/

      - run: calcit calcit.cirru

      - name: Verify async server response and cancellation
        run: bash scripts/check-server-ffi.sh
