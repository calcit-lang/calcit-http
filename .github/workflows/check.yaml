on:
  push:
    branches:
      - main
  pull_request: {}

name: Test

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: calcit-lang/setup-calcit@v1.3.0
        with:
          tools: calcit,caps

      - name: Validate Calcit snapshot and types
        run: |
          caps --ci
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only
          calcit calcit.cirru analyze quality --baseline config/calcit-quality.json --format json

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release

      - run: rm -rfv dylibs/* && mkdir -p dylibs/ && ls target/release/ && cp -v target/release/*.* dylibs/

      - run: calcit calcit.cirru

      - name: Verify async server response and cancellation
        run: bash scripts/check-server-ffi.sh
