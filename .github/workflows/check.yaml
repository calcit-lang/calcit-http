on:
  push:
    branches:
      - main
  pull_request: {}

name: Test

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: calcit-lang/setup-calcit@v1

      - name: Validate Calcit snapshot and types
        run: |
          caps --ci
          cr calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          cr calcit.cirru --check-only
          cr calcit.cirru analyze quality --baseline config/calcit-quality.json --format json

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release

      - run: rm -rfv dylibs/* && mkdir -p dylibs/ && ls target/release/ && cp -v target/release/*.* dylibs/

      - run: cr calcit.cirru
